<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>114-2 多元選修課程查詢系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .fade-in { animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f5f5f4; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #d6d3d1; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #a8a29e; }
    .course-card:hover { transform: translateY(-2px); }
    .week-row:nth-child(even) { background-color: #faf9f6; }
  </style>
</head>
<body class="bg-[#FDFBF7] min-h-screen font-sans text-stone-800">

  <!-- 背景裝飾 -->
  <div class="fixed top-0 left-0 w-full h-96 bg-gradient-to-br from-stone-800 via-stone-700 to-amber-900/90 pointer-events-none z-0"></div>
  <div class="fixed top-20 right-10 w-64 h-64 bg-white/5 rounded-full blur-3xl pointer-events-none z-0"></div>

  <div class="relative z-10 min-h-screen flex flex-col">

            <i class="fas fa-book-open text-2xl text-amber-200"></i>
          </div>
          <div>
            <h1 class="text-2xl font-extrabold tracking-wide">114-2 多元選修課程查詢</h1>
            <p class="text-stone-300 text-xs mt-0.5">Department of Curriculum · 大灣高中</p>
          </div>
        </div>
        <div class="hidden md:flex items-center px-3 py-1.5 rounded-full bg-black/20 text-xs border border-white/10 text-stone-200">
          <i class="fas fa-layer-group mr-2 text-amber-300"></i> 共 33 門課程
        </div>
      </div>
    </header>

    <!-- 麵包屑 -->
    <div id="breadcrumb" class="bg-[#FAF9F6]/95 backdrop-blur-md border-b border-stone-200 px-4 py-3 sticky top-0 z-40 shadow-sm">
      <div class="max-w-6xl mx-auto flex items-center gap-2 text-sm text-stone-600">
        <button onclick="showList()" class="hover:text-amber-700 transition-colors flex items-center">
          <i class="fas fa-home mr-1.5 text-stone-400"></i> 首頁
        </button>
        <span id="bc-sep" class="text-stone-300 hidden">/</span>
        <span id="bc-course" class="font-bold text-stone-800 hidden"></span>
      </div>
    </div>

    <main class="flex-1 max-w-6xl mx-auto w-full px-4 py-8">
      <!-- 列表視圖 -->
      <div id="list-view" class="fade-in">
        <!-- 搜尋區 -->
        <div class="mb-8">
          <div class="bg-white rounded-2xl shadow-sm border border-stone-200 p-6 md:p-8 relative overflow-hidden">
            <div class="absolute -right-8 -bottom-8 text-stone-100 opacity-60 pointer-events-none">
              <i class="fas fa-search text-[130px]"></i>
            </div>
            <div class="relative z-10">
              <div class="inline-block px-3 py-1 mb-3 rounded-full bg-amber-100 text-amber-800 text-xs font-bold">課程資料庫</div>
              <h2 class="text-2xl md:text-3xl font-extrabold text-stone-800 mb-2">輸入課程名稱查詢</h2>
              <p class="text-stone-500 text-sm mb-5">可搜尋中文名稱、英文名稱或關鍵字</p>
              <div class="relative max-w-xl">
                <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-stone-400"></i>
                <input id="search-input" type="text" placeholder="例如：Python、日本語、數學..." 
                  class="w-full pl-12 pr-4 py-3.5 rounded-xl border border-stone-300 focus:border-amber-500 focus:ring-2 focus:ring-amber-200 outline-none text-stone-800 text-base shadow-sm transition-all"
                  oninput="filterCourses(this.value)" />
                <button onclick="document.getElementById('search-input').value=''; filterCourses('')" 
                  class="absolute right-3 top-1/2 -translate-y-1/2 text-stone-300 hover:text-stone-500 transition-colors text-lg">
                  <i class="fas fa-times-circle"></i>
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- 結果計數 -->
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-lg font-bold text-stone-700 flex items-center">
            <i class="fas fa-th-large text-amber-600 mr-2"></i>
            <span id="result-count">全部 33 門課程</span>
          </h3>
        </div>

        <!-- 課程卡片格 -->
        <div id="courses-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
        </div>

        <!-- 無結果 -->
        <div id="no-result" class="hidden text-center py-20 text-stone-400">
          <i class="fas fa-inbox text-5xl mb-4 text-stone-300"></i>
          <p class="text-xl font-bold text-stone-500">找不到符合的課程</p>
          <p class="text-sm mt-1">試試其他關鍵字</p>
        </div>
      </div>

      <!-- 課程詳細視圖 -->
      <div id="detail-view" class="hidden fade-in">
        <button onclick="showList()" class="mb-6 flex items-center text-stone-500 hover:text-stone-800 hover:-translate-x-1 transition-all bg-white py-2 px-4 rounded-full shadow-sm border border-stone-200 text-sm">
          <i class="fas fa-arrow-left mr-2"></i> 返回課程列表
        </button>
        <div id="detail-content"></div>
      </div>
    </main>

    <footer class="text-center py-6 text-xs text-stone-400 font-medium">
      大灣高中 114-2 多元選修課程查詢系統 &copy; 2025 <i class="fas fa-leaf mx-1 text-amber-700/30"></i>
    </footer>
  </div>

B1.符號運用與溝通表達, B3.藝術涵養與美感素養\nC社會參與：\nC2.人際關係與團隊合作, C3.多元文化與國際理解", "學生圖像": "發展力, 智慧力", "學習目標": "1.依照各種情境可以使用簡單日文會話。\n2.對語言學習有興趣，養成閱讀,探討的習慣。\n3.認識日本文化，發現異國文化的美，運用於生活。\n4.學生是主體、期許學生俱有創造思考、獨立判斷、自我發展能力。", "教學大綱": "週次/序\n單元/主題\n內容綱要\n一\n『淺談日本語』\n1.日本語的構成。\n2.日語發音的基礎知識。\n3.教室活動---簡單日語自我介紹。\n二\n日語的音韻\n1.清音、濁音、半濁音、拗音、長音、促音。\n2.教室基本用語。\n3.日常生活用語。\n4.教室活動---日常招呼。\n5.文化介紹＿吃壽司的禮儀。\n三\n平假名(1)\n1.以日本料理的調味料記憶50音。\n2.時間讀法。\n3.教室活動-日本文化介紹\n四\n平假名(2)\n1.早口言葉。\n2.平假名讀法及書寫。\n3.教室活動---平假名賓果遊戲。\n五\n我喜歡的數字\n1.數字讀法，數字會話練習。\n2.喜歡、討厭的日文句型表現。\n3.慣用句介紹。\n4.教室活動---認識新朋友、並詢問喜歡的數字後發表。\n六\n今天是星期ㄧ\n1.星期的讀法。\n2.基本句型練習。\n3.教室活動---我的一週預定表。\n4.日文歌曲欣賞_『夢を追いかける』。『東京協奏曲』。\n七\n櫻前線\n1.移動動詞導入\n2.文化介紹＿賞櫻名所介紹\n3.教室活動-平假名遊戲\n八\n今晚月色很美\n1.量詞\n2.關於愛情的單字\n3.會話練習\n4.接受與拒絕的句型表現\n九\n今天是我的生日\n1.日期的讀法（年月日）。\n2.基本句型練習。\n3.教室活動---尋找同伴（同月生、同星座）。\n十\n形容詞\n1.形容詞的說明\n2.形容詞的否定\n3.描寫遊戲\n4.教室活動-形容詞卡片練習相反字詞\n十一\n我家有6個人\n1.家族稱謂讀法。\n2.人數讀法。\n3.存在動詞導入。\n4.教室活動---家族成員、人數調查。\n十二\n一起用餐\n1. 餐廳用餐（人數,料理名稱）\n2. 情境角色扮演（會話練習）\n十三\n這是我的手機\n1.指示詞。\n2.學習疑問句的用法。\n3.教室活動---日本摺紙。（切り絵）\n十四\n現在幾點了？\n1.時間的讀法。\n2.「從幾點到幾點」的句型學習。\n3.假日的生活形態。\n4.教室活動---生活習慣調查。\n十五\n文化體驗\n1.日本萬花筒文化\n2. 萬花筒實作\n十六\n我的數學不太行\n1.喜歡的顏色,興趣,科目\n2.喜惡,擅長,不擅長的日語表現\n3.會話練習\n4.描寫（聽到的內容）\n十七\n地下鐵的入口在哪裡？\n1.地點、方向指示詞。\n2.物品的位置及場所。\n3.教室活動---角色扮演（在車站、機場）。\n十八\n分組發表會\n1.分野：文化、食物、動漫、流行歌曲、旅行、流行、社會現象等等分野、學生五人一個分野、自行決定該分野的題目、團隊討論如何收集消化整合資料、以PPT形式發表。\n十九\n二十\n二十一\n二十二", "學習評量": "1.上課態度。（40%）\n2.口頭發表。(20%)\n3.出席率。(20%)\n4.書面報告。(20%)", "備註": "", "schedule": [{"week": "一", "topic": "『淺談日本語』", "content": "1.日本語的構成。"}, {"week": "二", "topic": "日語的音韻", "content": "1.清音、濁音、半濁音、拗音、長音、促音。"}, {"week": "三", "topic": "平假名(1)", "content": "1.以日本料理的調味料記憶50音。"}, {"week": "四", "topic": "平假名(2)", "content": "1.早口言葉。"}, {"week": "五", "topic": "我喜歡的數字", "content": "1.數字讀法，數字會話練習。"}, {"week": "六", "topic": "今天是星期ㄧ", "content": "1.星期的讀法。"}, {"week": "七", "topic": "櫻前線", "content": "1.移動動詞導入"}, {"week": "八", "topic": "今晚月色很美", "content": "1.量詞"}, {"week": "九", "topic": "今天是我的生日", "content": "1.日期的讀法（年月日）。"}, {"week": 的字彙。\n2.第一人稱與第三人稱表達希望的句型說明。\n3. 教室活動---表達自己的期望。\n十一\n文化介紹\n1.日本年中行事。\n2.異文化的理解與意見回饋。\n十二\n未來的志向。\n1. 職業的讀法，職業名稱。\n2. 日本職場文化介紹（應允與拒絕行為）。\n3. 職業名稱猜謎及賓果遊戲。\n十三\n形同意不同。\n1.中文和漢字相同，意思完全不同的字詞。\n2.短文閱讀。\n十四\n擬聲語、擬態語\n1.擬聲語、擬態語的介紹，學習依照情境運用。\n2.擬聲語、擬態語加上動詞的使用。\n3.以插畫圖片記憶擬聲語、擬態語。\n十五\n我家附近的建築物\n1.建築物的讀法。\n2.方向字彙及句型導入。\n3.讓學生自己畫地圖，發表自家周圍的建築物。\n十六\n木村先生送玫瑰花給我\n1.授受動詞導入。\n2.親殊關係之應用句型。\n3.教室活動---授受動詞的卡片遊戲。\n十七\n銀行領錢\n1. ATM使用的基本單字句型。\n2.基本生活會話。\n十八\n文化介紹\n日本的年中行事（賞櫻花、入學式、鯉魚節、女兒節、耶誕節、 除夕等等）。\n十九\n分組發表會\n1.分野：文化、食物、動漫、流行歌曲、旅行、流行、社會現象等等分野、學生五人一個分野、自行決定該分野的題目、團隊討論如何收集消化整合資料、以PPT形式發表。\n2.小組討論，團隊合作。\n3.與學生意見交流。\n二十\n期末總復習\n1.學期末總復習。\n2.與學生意見交流。\n二十一\n二十二", "學習評量": "1.上課態度。（40%）\n2.口頭發表。(20%)\n3.出席率。(20%)\n4.書面報告。(20%)", "備註": "", "schedule": [{"week": "一", "topic": "這不是我的課本", "content": "1.指示詞（これ、それ、あれ）。"}, {"week": "二", "topic": "訪談遊戲", "content": "1.疑問詞導入（どこ、何、いつ、どんな）。"}, {"week": "三", "topic": "我要去京都", "content": "1.移動動詞導入。"}, {"week": "四", "topic": "請給我兩個蘋果", "content": "1.量詞。"}, {"week": "五", "topic": "昨天我去看電影", "content": "1.動詞過去式導入。"}, {"week": "六", "topic": "櫻花很美", "content": "1.形容詞導入。"}, {"week": "七", "topic": "漂亮的洋裝", "content": "1.形容詞復習。"}, {"week": "八", "topic": "感冒了向學校請假", "content": "1.表『原因』的から導入。"}, {"week": "九", "topic": "昨天的天氣比今天熱", "content": "1.比較句型。"}, {"week": "十", "topic": "表達『希望』", "content": "1.表達希望的字彙。"}, {"week": "十一", "topic": "文化介紹", "content": "1.日本年中行事。"}, {"week": "十二", "topic": "未來的志向。", "content": "1. 職業的讀法，職業名稱。"}, {"week": "十三", "topic": "形同意不同。", "content": "1.中文和漢字相同，意思完全不同的字詞。"}, {"week": "十四", "topic": "擬聲語、擬態語", "content": "1.擬聲語、擬態語的介紹，學習依照情境運用。"}, {"week": "十五", "topic": "我家附近的建築物", "content": "1.建築物的讀法。"}, {"week": "十六", "topic": "木村先生送玫瑰花給我", "content": "1.授受動詞導入。"}, {"week": "十七", "topic": "銀行領錢", "content": "1. ATM使用的基本單字句型。"}, {"week": "十八", "topic": "文化介紹", "content": "日本的年中行事（賞櫻花、入學式、鯉魚節、女兒節、耶誕節、 除夕等等）。"}, {"week": "十九", "topic": "分組發表會", "content": "1.分野：文化、食物、動漫、流行歌曲、旅行、流行、社會現象等等分野、學生五人一個分野、自行決定該分野的題目、團隊討論如何收集消化整合資料、以PPT形式發表。"}, {"week 但丁（義大利詩人¸Dante¸Alighieri¸1265～1321）～ 2.阿波羅尼奧斯圓（Apollonius circles）\n六\n段考週\n課程緩衝\n七\n多項式\n1.拉丁文 \"Cogito ergo sum\"，英文\"I think, therefore I am\"，（我思故我在）～笛卡爾～ 2.牛頓法求近似根\n八\n三角函數\n1.三角學在某種意義下，就像是望遠鏡的前身，它把遠在天邊的東西，拉近到可以測量的範圍。～Stanley L.Jaki《物理學的相關性》～ 2.無字證明、托勒密定理、海龍公式\n九\n數列\n1歸納、類推、大膽假設，透過新的猜測不斷修正，這是大自然提供的美妙技巧，也是追求真理的主要方法。～拉普拉斯～ 2.費氏數列\n十\n數據分析\n1.對正確的問題有近似的答案，勝過對錯的問題有精確的答案。～美國統計學學者杜奇(Tukey)～ 2.迴歸直線\n十一\n排列組合\n1.萬物皆數。～畢達哥拉斯～ 2.環狀排列\n十二\n段考週\n課程緩衝\n十三\n機率\n1.你信仰骰子的上帝，我卻信仰完備的定律與秩序。～愛因斯坦～ 2.電腦型彩券的中獎機率、生日問題\n十四\n指數與對數函數\n1.對數的發明延長了天文學家的壽命。～拉普拉斯～ 2.銀行存款、放射性物質衰變\n十五\n平面向週量\n1.數缺形少直覺，形缺數難入微。～華羅庚～ 2.克拉瑪公式、孟氏定理、西瓦定理\n十六\n空間向量\n1.數學不管多抽象，總有一天可以用在外在的真實世界。～Lobachevsky～ 2.錐體體積公式\n十七\n空間中平面與直線\n1.數學是上帝用來書寫宇宙的文字。～伽利略～ 2.空間中兩直線的公垂線\n十八\n矩陣\n1.數學是科學的大門和鑰匙～Roger Bacon～ 2.馬可夫鏈\n十九\n二十\n二十一\n二十二", "學習評量": "1.小組書面報告(含學習單設計) ：30% 2.小組上台發表：30% 3.個人學習單繳交：20% 4.個人課堂參與發言：20%", "備註": "", "schedule": [{"week": "一", "topic": "課程介紹", "content": "說明學習目標，指導學生蒐集資料，並進行小組分配"}, {"week": "二", "topic": "蒐集資料", "content": "小組蒐集整理資料"}, {"week": "三", "topic": "報告編寫", "content": "小組撰寫報告心得，並與老師討論學習單的設計"}, {"week": "四", "topic": "數與式", "content": "1. Number rules the universe.（數統治著宇宙。）～畢達哥拉斯～ 2.絕對值函數與圖形"}, {"week": "五", "topic": "直線與圓", "content": "1.圓是最完美的圖形。～但丁（義大利詩人¸Dante¸Alighieri¸1265～1321）～ 2.阿波羅尼奧斯圓（Apollonius circles）"}, {"week": "六", "topic": "段考週", "content": "課程緩衝"}, {"week": "七", "topic": "多項式", "content": "1.拉丁文 \"Cogito ergo sum\"，英文\"I think, therefore I am\"，（我思故我在）～笛卡爾～ 2.牛頓法求近似根"}, {"week": "八", "topic": "三角函數", "content": "1.三角學在某種意義下，就像是望遠鏡的前身，它把遠在天邊的東西，拉近到可以測量的範圍。～Stanley L.Jaki《物理學的相關性》～ 2.無字證明、托勒密定理、海龍公式"}, {"week": "九", "topic": "數列", "content": "1歸納、類推、大膽假設，透過新的猜測不斷修正，這是大自然提供的美妙技巧，也是追求真理的主要方法。～拉普拉斯～ 2.費氏數列"}, {"week": "十", "topic": "數據分析", "content": "1.對正確的問題有近似的答案，勝過對錯的問題有精確的答案。～美國統計學學者杜奇(Tukey)～ 2.迴歸直線"}, {"week": "十一", "topic": "排列組合", "content": "1.萬物皆數。～畢達哥拉斯～ 2.環狀排列"}, {"week": "十二", "topic": "段考週", "content": "課程緩衝"}, {"week": "十三", "topic": "機率", "content": "1.你信仰骰子的上帝，我卻信仰完備的定         (c['課程屬性'] || '').toLowerCase().includes(q) ||
        (c['學習目標'] || '').toLowerCase().includes(q) ||
        (c['議題融入'] || '').toLowerCase().includes(q)
      );
    }
    renderGrid();
  }

  function renderGrid() {
    const grid = document.getElementById('courses-grid');
    const noResult = document.getElementById('no-result');
    const count = document.getElementById('result-count');

    count.textContent = filtered.length === COURSES.length 
      ? `全部 ${COURSES.length} 門課程`
      : `找到 ${filtered.length} 門課程`;

    if (filtered.length === 0) {
      grid.innerHTML = '';
      noResult.classList.remove('hidden');
      return;
    }
    noResult.classList.add('hidden');

    grid.innerHTML = filtered.map((c, idx) => {
      const realIdx = COURSES.indexOf(c);
      const attr = c['課程屬性'] || '多元選修';
      const grade = c['授課年段'] || '';
      const credits = c['學分總數'] || '';
      const scheduleLen = c.schedule ? c.schedule.filter(w => w.topic && w.topic !== '期中考' && w.topic !== '期末考' && w.topic !== '期末考').length : 0;
      
      const attrColor = attr.includes('專題') ? 'bg-blue-100 text-blue-700 border-blue-200' : 
                        attr.includes('加深') ? 'bg-purple-100 text-purple-700 border-purple-200' :
                        'bg-amber-100 text-amber-700 border-amber-200';

      return `
        <div onclick="showDetail(${realIdx})" 
          class="course-card bg-white rounded-2xl border border-stone-200 p-5 cursor-pointer hover:border-amber-400 hover:shadow-md transition-all duration-200 group">
          <div class="flex items-start justify-between mb-3">
            <span class="inline-flex items-center px-2 py-0.5 rounded text-[11px] font-bold border ${attrColor}">${attr}</span>
            <i class="fas fa-arrow-right text-stone-300 group-hover:text-amber-600 transition-colors mt-0.5"></i>
          </div>
          <h3 class="font-extrabold text-stone-800 text-base mb-1 group-hover:text-amber-700 transition-colors leading-snug">${c.name}</h3>
          ${c.name_en ? `<p class="text-xs text-stone-400 mb-3 italic">${c.name_en}</p>` : '<div class="mb-3"></div>'}
          <div class="bg-[#FAF9F6] rounded-xl p-3 border border-stone-100 space-y-1.5 text-xs">
            ${grade ? `<div class="flex items-center text-stone-600"><i class="fas fa-user-graduate w-4 text-stone-400 mr-1.5"></i>${grade}</div>` : ''}
            ${credits ? `<div class="flex items-center text-stone-600"><i class="fas fa-star w-4 text-stone-400 mr-1.5"></i>${credits} 學分</div>` : ''}
            ${scheduleLen > 0 ? `<div class="flex items-center text-stone-600"><i class="fas fa-list-ul w-4 text-stone-400 mr-1.5"></i>${scheduleLen} 週教學內容</div>` : ''}
          </div>
        </div>`;
    }).join('');
  }

  function showDetail(idx) {
    const c = COURSES[idx];
    document.getElementById('list-view').classList.add('hidden');
    const dv = document.getElementById('detail-view');
    dv.classList.remove('hidden');
    dv.classList.add('fade-in');

    document.getElementById('bc-sep').classList.remove('hidden');
    const bcCourse = document.getElementById('bc-course');
    bcCourse.classList.remove('hidden');
    bcCourse.textContent = c.name;

    const attr = c['課程屬性'] || '多元選修';
    const attrColor = attr.includes('專題') ? 'bg-blue-100 text-blue-700 border-blue-200' : 
                      attr.includes('加深') ? 'bg-purple-100 text-purple-700 border-purple-200' :
                      'bg-amber-100 text-amber-700 border-amber-200';

    const infoFields = [
      ['授課年段', 'fa-user-graduate'],
      ['學分總數', 'fa-star'],
      ['課程屬性', 'fa-tag'],
      ['議題融入', 'fa-lightbulb'],
      ['師資來源', 'fa-chalkboard-teacher'],
    ];

    const infoCards = infoFields
      .filter(([k]) => c[k])
      .map(([k, icon]) => `
        <div class="bg-[#FAF9F6] border border-stone-100 rounded-xl p-4">
          <div class="text-xs text-stone-400 font-medium mb-1"><i class="fas ${icon} mr-1"></i>${k}</div>
          <div class="font-bold text-stone-800 text-sm">${c[k]}</div>
        </div>`).join('');

    const scheduleHtml = c.schedule && c.schedule.length > 0 ? `
      <div class="bg-white rounded-2xl border border-stone-200 shadow-sm overflow-hidden mb-6">
        <div class="bg-stone-50 px-6 py-4 border-b border-stone-200">
          <h3 class="text-lg font-bold text-stone-800 flex items-center">
            <i class="fas fa-calendar-alt text-amber-600 mr-2"></i> 教學大綱
          </h3>
        </div>
        <div class="overflow-x-auto custom-scrollbar">
          <table class="w-full text-sm min-w-[500px]">
            <thead>
              <tr class="bg-stone-50 border-b border-stone-200 text-stone-500 text-xs uppercase tracking-wider">
                <th class="px-6 py-3 text-left font-bold w-16">週次</th>
                <th class="px-6 py-3 text-left font-bold w-1/3">單元主題</th>
                <th class="px-6 py-3 text-left font-bold">內容綱要</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-stone-100">
              ${c.schedule.map(w => `
                <tr class="week-row hover:bg-amber-50/30 transition-colors">
                  <td class="px-6 py-3 font-bold text-amber-700 whitespace-nowrap">${w.week}</td>
                  <td class="px-6 py-3 font-medium text-stone-800">${w.topic}</td>
                  <td class="px-6 py-3 text-stone-600 leading-relaxed">${w.content}</td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>` : '';

    const goalsHtml = c['學習目標'] ? `
      <div class="bg-white rounded-2xl border border-stone-200 shadow-sm p-6 mb-6">
        <h3 class="text-lg font-bold text-stone-800 mb-3 flex items-center">
          <i class="fas fa-bullseye text-amber-600 mr-2"></i> 學習目標
        </h3>
        <div class="text-stone-600 leading-relaxed whitespace-pre-line text-sm">${c['學習目標']}</div>
      </div>` : '';

    const coreHtml = c['課綱核心素養'] ? `
      <div class="bg-white rounded-2xl border border-stone-200 shadow-sm p-6 mb-6">
        <h3 class="text-lg font-bold text-stone-800 mb-3 flex items-center">
          <i class="fas fa-award text-amber-600 mr-2"></i> 課綱核心素養
        </h3>
        <div class="text-stone-600 leading-relaxed whitespace-pre-line text-sm">${c['課綱核心素養']}</div>
      </div>` : '';

    const evalHtml = c['學習評量'] ? `
      <div class="bg-white rounded-2xl border border-stone-200 shadow-sm p-6 mb-6">
        <h3 class="text-lg font-bold text-stone-800 mb-3 flex items-center">
          <i class="fas fa-clipboard-check text-amber-600 mr-2"></i> 學習評量
        </h3>
        <div class="text-stone-600 leading-relaxed whitespace-pre-line text-sm">${c['學習評量']}</div>
      </div>` : '';

    const remarkHtml = c['備註'] ? `
      <div class="bg-amber-50 border border-amber-200 rounded-2xl p-6 mb-6">
        <h3 class="text-lg font-bold text-amber-800 mb-3 flex items-center">
          <i class="fas fa-sticky-note text-amber-600 mr-2"></i> 備註
        </h3>
        <div class="text-amber-700 leading-relaxed whitespace-pre-line text-sm">${c['備註']}</div>
      </div>` : '';

    document.getElementById('detail-content').innerHTML = `
      <!-- 課程標題卡 -->
      <div class="bg-white rounded-2xl border border-stone-200 shadow-sm p-6 md:p-8 mb-6 relative overflow-hidden">
        <div class="absolute -right-8 -bottom-8 text-stone-100 opacity-50 pointer-events-none">
          <i class="fas fa-book-open text-[150px]"></i>
        </div>
        <div class="relative z-10">
          <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-bold border mb-3 ${attrColor}">${attr}</span>
          <h2 class="text-2xl md:text-3xl font-extrabold text-stone-800 mb-1">${c.name}</h2>
          ${c.name_en ? `<p class="text-stone-400 italic text-sm mb-5">${c.name_en}</p>` : '<div class="mb-5"></div>'}
          <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-3">
            ${infoCards}
          </div>
        </div>
      </div>

      ${goalsHtml}
      ${coreHtml}
      ${scheduleHtml}
      ${evalHtml}
      ${remarkHtml}
    `;

    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function showList() {
    document.getElementById('detail-view').classList.add('hidden');
    document.getElementById('list-view').classList.remove('hidden');
    document.getElementById('bc-sep').classList.add('hidden');
    document.getElementById('bc-course').classList.add('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // 初始化
  renderGrid();
  </script>
</body>
</html>
